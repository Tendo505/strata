name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Tests (model, crash, concurrency) and benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew test --console=plain
      - name: Benchmark (200,000 keys)
        run: |
          ./gradlew installDist --console=plain
          build/install/strata/bin/strata bench 200000 | tee -a "$GITHUB_STEP_SUMMARY"
